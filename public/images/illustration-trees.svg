<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Line drawing of a row of trees">
  <defs>
    <pattern id="nb-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1" />
    </pattern>
    <g id="nb-tree">
      <path d="M0 0v-46" />
      <circle cx="0" cy="-70" r="30" />
      <circle cx="0" cy="-70" r="30" fill="url(#nb-hatch)" stroke="none" opacity=".3" />
      <path d="M-30-70h60M0-100v60" opacity=".45" />
    </g>
  </defs>

  <path d="M0 200h600" />

  <g opacity=".9">
    <use href="#nb-tree" transform="translate(70 200) scale(.7)" />
    <use href="#nb-tree" transform="translate(170 200) scale(.95)" />
    <use href="#nb-tree" transform="translate(300 200) scale(1.15)" />
    <use href="#nb-tree" transform="translate(440 200) scale(.8)" />
    <use href="#nb-tree" transform="translate(535 200) scale(.6)" />
  </g>
</svg>
