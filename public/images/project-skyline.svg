<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-label="Illustration of twin residential towers at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16263d"/>
      <stop offset="1" stop-color="#2c4462"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d6a2"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <pattern id="win" width="18" height="24" patternUnits="userSpaceOnUse">
      <rect width="18" height="24" fill="none"/>
      <rect x="3" y="5" width="9" height="11" rx="1" fill="#0f1b2b" opacity="0.3"/>
    </pattern>
    <radialGradient id="glow" cx="0.75" cy="0.16" r="0.5">
      <stop offset="0" stop-color="#d9b166" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d9b166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="550" fill="url(#sky)"/>
  <rect width="800" height="550" fill="url(#glow)"/>
  <circle cx="590" cy="120" r="48" fill="#d9b166" opacity="0.45"/>
  <g fill="#0d1726" opacity="0.5">
    <rect x="20" y="300" width="80" height="240"/>
    <rect x="110" y="350" width="50" height="190"/>
    <rect x="640" y="320" width="70" height="220"/>
    <rect x="720" y="370" width="55" height="170"/>
  </g>
  <rect x="240" y="140" width="120" height="400" fill="url(#tower)"/>
  <rect x="240" y="140" width="120" height="400" fill="url(#win)"/>
  <rect x="230" y="130" width="140" height="12" rx="2" fill="#f0d6a2"/>
  <rect x="430" y="200" width="110" height="340" fill="#20344f"/>
  <rect x="430" y="200" width="110" height="340" fill="url(#win)"/>
  <rect x="422" y="190" width="126" height="12" rx="2" fill="#8fa2b8"/>
  <rect x="200" y="480" width="400" height="60" fill="#0d1726"/>
  <g fill="#d9b166" opacity="0.75">
    <rect x="230" y="498" width="34" height="42"/>
    <rect x="300" y="498" width="34" height="42"/>
    <rect x="450" y="498" width="34" height="42"/>
    <rect x="520" y="498" width="34" height="42"/>
  </g>
  <rect y="540" width="800" height="10" fill="#0a1320"/>
</svg>
