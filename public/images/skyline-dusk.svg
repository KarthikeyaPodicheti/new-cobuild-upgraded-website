<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" width="1920" height="760" role="img" aria-label="Illustration of a city skyline at dusk">
  <defs>
    <linearGradient id="dusk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2821"/>
      <stop offset="0.55" stop-color="#144235"/>
      <stop offset="1" stop-color="#1c5545"/>
    </linearGradient>
    <linearGradient id="dusk-haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7f64" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2f7f64" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dusk-windows" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="10" height="14" fill="#4b9d81" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1920" height="760" fill="url(#dusk-sky)"/>
  <circle cx="1480" cy="190" r="96" fill="#4b9d81" opacity="0.32"/>
