<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-label="Illustration of a riverfront residential tower at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2140"/>
      <stop offset="0.6" stop-color="#6b3450"/>
      <stop offset="1" stop-color="#8a4a5c"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7cf9c"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2038"/>
      <stop offset="1" stop-color="#141a2b"/>
    </linearGradient>
    <pattern id="win" width="17" height="22" patternUnits="userSpaceOnUse">
      <rect width="17" height="22" fill="none"/>
      <rect x="3" y="4" width="8" height="10" rx="1" fill="#3a2140" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="550" fill="url(#sky)"/>
  <circle cx="150" cy="140" r="44" fill="#f0d6a2" opacity="0.5"/>
  <g fill="#2a1c33" opacity="0.55">
    <rect x="20" y="330" width="80" height="150"/>
    <rect x="110" y="370" width="52" height="110"/>
    <rect x="690" y="350" width="80" height="130"/>
  </g>
  <rect x="300" y="150" width="110" height="330" fill="url(#tower)"/>
  <rect x="300" y="150" width="110" height="330" fill="url(#win)"/>
  <rect x="292" y="140" width="126" height="12" rx="2" fill="#f0d6a2"/>
  <rect x="440" y="230" width="90" height="250" fill="#3a2a45"/>
  <rect x="440" y="230" width="90" height="250" fill="url(#win)"/>
  <rect x="433" y="222" width="104" height="10" rx="2" fill="#a58a9e"/>
  <rect x="250" y="470" width="310" height="16" fill="#2a1c33"/>
  <rect y="486" width="800" height="64" fill="url(#water)"/>
  <g fill="#d9b166" opacity="0.28">
    <rect x="310" y="496" width="90" height="6"/>
    <rect x="318" y="510" width="74" height="4"/>
    <rect x="330" y="522" width="52" height="4"/>
    <rect x="450" y="500" width="70" height="5"/>
    <rect x="458" y="514" width="54" height="4"/>
  </g>
</svg>
