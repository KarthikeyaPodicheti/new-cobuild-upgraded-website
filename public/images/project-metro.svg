<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-label="Illustration of a glass commercial block">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182a3d"/>
      <stop offset="1" stop-color="#2b4360"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5b7c"/>
      <stop offset="1" stop-color="#1b2f47"/>
    </linearGradient>
    <pattern id="grid" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect width="26" height="34" fill="none"/>
      <rect x="4" y="6" width="18" height="22" rx="1" fill="#d9b166" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="800" height="550" fill="url(#sky)"/>
  <circle cx="180" cy="110" r="46" fill="#d9b166" opacity="0.25"/>
  <g fill="#0d1726" opacity="0.5">
    <rect x="30" y="280" width="70" height="250"/>
    <rect x="110" y="330" width="46" height="200"/>
    <rect x="700" y="300" width="70" height="230"/>
  </g>
  <rect x="180" y="180" width="440" height="340" fill="url(#glass)" rx="4"/>
  <rect x="180" y="180" width="440" height="340" fill="url(#grid)" rx="4"/>
  <rect x="170" y="170" width="460" height="14" rx="2" fill="#8fa2b8"/>
  <rect x="180" y="360" width="440" height="6" fill="#d9b166" opacity="0.5"/>
  <rect x="300" y="430" width="200" height="90" fill="#0d1726"/>
  <rect x="330" y="452" width="140" height="60" fill="#d9b166" opacity="0.45"/>
  <rect x="120" y="512" width="580" height="20" fill="#0d1726"/>
  <rect y="532" width="800" height="18" fill="#0a1320"/>
</svg>
